<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Календар міжнародних спортивних заходів 2027</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#1f4fa3;--danger:#b42318;--warn:#93370d;--ok:#067647}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}.page{max-width:1400px;margin:auto;padding:16px}.head{display:grid;grid-template-columns:150px 1fr 120px;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 22px;box-shadow:0 8px 22px #10182814}.logo{height:105px;display:flex;align-items:center;justify-content:center;padding:4px}.logo img{display:block;max-width:100%;max-height:100%;object-fit:contain}.logo-left img{max-width:125px}.logo-right img{max-width:92px}.head h1{margin:0;text-align:center;font-size:clamp(24px,4vw,40px);line-height:1.08}.head p{text-align:center;color:var(--muted);margin:8px 0 0}.tools{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.period-nav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.periodbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.month-arrow{font-size:22px;line-height:1;padding:7px 11px}.periodbar button{white-space:nowrap}.period-summary{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:12px 0 10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.period-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.period-title{font-size:23px;font-weight:800}.period-count{font-size:12px;color:var(--muted)}.filters-title{font-size:12px;font-weight:700;color:#475467;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:8px}input,select,button{font:inherit}input,select{width:100%;height:42px;border:1px solid #d0d5dd;border-radius:9px;padding:0 10px;background:#fff}.acts{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}button{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}button.active{background:#eaf2ff;border-color:#9cc2ff;color:#174a98}.meta{margin-left:auto;color:var(--muted);font-size:13px}.notice{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff6dd;border:1px solid #f3d18c;color:#7a4a00}.events-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-top:16px}.event-stats{font-size:12px;color:var(--muted);text-align:right}.events-label{font-size:20px;font-weight:800}.events-note{font-size:12px;color:var(--muted)}.content{margin-top:10px}.month{margin-bottom:20px}.month h2{margin:0 0 8px;font-size:21px}.count{font-size:12px;color:var(--muted);font-weight:400}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;box-shadow:0 3px 12px #1018280c}.card-inner{display:grid;grid-template-columns:92px 1fr;min-height:150px}.datebox{background:#f1f5fb;border-right:1px solid var(--line);padding:15px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}.date-day{font-size:25px;font-weight:800;line-height:1}.date-month{font-size:12px;font-weight:700;text-transform:uppercase;margin-top:5px;color:var(--accent)}.date-end{font-size:11px;color:var(--muted);margin-top:8px}.card-body{padding:14px}.card.cancel{opacity:.65}.card.cancel .title{text-decoration:line-through}.title{font-size:17px;font-weight:750}.sport{font-size:13px;color:var(--accent);font-weight:650;margin-top:3px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.b{font-size:11px;padding:4px 7px;border-radius:99px;background:#eef2f7}.b.cancel{background:#fee4e2;color:var(--danger)}.b.planned{background:#eaf2ff;color:#174a98}.b.confirmed{background:#dcfae6;color:var(--ok)}.b.cls{background:#e8f5ee;color:var(--ok)}.b.live{background:#e8f5ee;color:#067647;font-weight:700}.b.upcoming{background:#eef4ff;color:#3538cd}.b.done{background:#f2f4f7;color:#667085}.card{cursor:pointer}.card:hover{border-color:#b8c6dc;box-shadow:0 8px 24px #10182814}.card:focus{outline:3px solid #9cc2ff;outline-offset:2px}.info{display:grid;grid-template-columns:85px 1fr;gap:6px 8px;font-size:13px}.k{color:var(--muted)}.notes{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:#475467}.table{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:12px}th{background:#f8fafc;position:sticky;top:0}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:30px;text-align:center;color:var(--muted)}footer{text-align:center;color:#98a2b3;font-size:11px;margin:24px 0 6px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.page{padding:9px}.card-inner{grid-template-columns:72px 1fr}.date-day{font-size:21px}.head{grid-template-columns:74px 1fr 58px;padding:10px;gap:7px}.logo{height:64px;padding:0}.logo-left img{max-width:70px}.logo-right img{max-width:48px}.head h1{font-size:22px}.head p{font-size:11px}.grid,.cards{grid-template-columns:1fr}.meta{width:100%;margin:0}}
.modal-back{position:fixed;inset:0;background:#0f172a80;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-back.show{display:flex}.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 70px #0f172a40}.modal-head{display:flex;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:22px}.modal-close{font-size:22px;line-height:1;padding:4px 10px}.modal-body{padding:18px 20px}.detail-grid{display:grid;grid-template-columns:155px 1fr;gap:10px 14px;font-size:14px}.detail-k{color:var(--muted)}.modal-note{margin-top:16px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}@media print{body{background:#fff}.tools,.month-arrow,#printbtn,.modal-back{display:none!important}.page{max-width:none;padding:0}.head{box-shadow:none;border:0}.cards{grid-template-columns:repeat(2,1fr)}.card{break-inside:avoid;box-shadow:none}.events-head{margin-top:14px}}</style></head><body><div class="page"><header class="head"><div class="logo logo-left"><img src="npc_ukraine_logo_ua.png" alt="Національний Паралімпійський Комітет України"></div><div><h1>Календар міжнародних спортивних заходів 2027</h1><p>Національний паралімпійський комітет України</p></div><div class="logo logo-right"><img src="npc_ukraine_logo_en.png" alt="Ukraine Paralympic Committee"></div></header><section class="tools"><div class="period-nav"><button id="prevmonth" class="month-arrow" aria-label="Попередній місяць">‹</button><div class="periodbar" id="periodbar"></div><button id="nextmonth" class="month-arrow" aria-label="Наступний місяць">›</button></div><div class="period-summary"><div><div class="period-label">Період</div><div class="period-title" id="periodtitle">Поточний місяць</div></div><div class="period-count" id="periodcount"></div></div><div class="filters-title">Додаткові фільтри</div><div class="grid"><select id="sport"><option value="">Усі види спорту</option></select><select id="type"><option value="">Усі типи заходів</option></select><select id="country"><option value="">Усі країни</option></select><select id="status"><option value="">Усі статуси</option></select><select id="cls"><option value="">Класифікація: усі</option><option>Так</option><option>Ні</option></select><input id="q" type="search" placeholder="Пошук за назвою, містом, країною…"></div><div class="acts"><button id="cards" class="active">Картки</button><button id="table">Таблиця</button><button id="reset">Скинути фільтри</button><button id="printbtn">Друк</button><button id="reload">Оновити дані</button><label style="font-size:12px;color:#475467"><input id="hide" type="checkbox" style="width:auto;height:auto"> приховати скасовані</label><span class="meta" id="meta"></span></div><div class="notice" id="notice"></div></section><section class="events-head"><div><div class="events-label">Заходи вибраного періоду</div><div class="events-note">Список оновлюється при зміні місяця або фільтрів</div></div><div class="event-stats" id="eventstats"></div></section><main id="content" class="content" aria-live="polite"></main><div class="modal-back" id="modalback"><div class="modal"><div class="modal-head"><h3 id="modaltitle"></h3><button class="modal-close" id="modalclose" aria-label="Закрити">×</button></div><div class="modal-body" id="modalbody"></div></div></div><footer>Заходи сортуються за датою за зростанням незалежно від порядку рядків у Google Sheets.</footer></div><script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vRBcMaHJikkvjUgc-AfGScmqE3ojrHaCqTd6gP2rsslZqexsoujeemZF2-8gZsJjK6EcYl5oNY7m306/pub?gid=987654321&single=true&output=csv';
const STATUSES=['Заплановано','Підтверджено','Скасовано'];
const H=['id','sport','name','start','end','venue','country','city','manager','notes','status','type','types','classification','venueLevel','datePrecision','completeness','sortDate'];
let data=[],view='cards';const now=new Date(),CY=now.getFullYear(),CM=now.getMonth();let period=CY===2027?String(CM):'year';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function obj(r){let o={};H.forEach((h,i)=>o[h]=(r[i]??'').trim());return o}function date(s){let m=(s||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):new Date(2999,0,1)}
function csv(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);a.push(r);r=[];c=''}else c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
function setSel(id,key,label){let selected=$(id).value;let vals=key==='status'?[...STATUSES]:[...new Set(data.flatMap(e=>key==='type'?(e.types||e.type).split('|').map(x=>x.trim()):[e[key]]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'uk'));$(id).innerHTML='<option value="">'+label+'</option>'+vals.map(v=>'<option>'+esc(v)+'</option>').join('');if(vals.includes(selected))$(id).value=selected}
function eventDate(s){let m=(s||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);if(!m)return null;let d=new Date(+m[3],+m[2]-1,+m[1]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[1]?d:null}
function dateBounds(s){
 const exact=eventDate(s);if(exact)return[exact,exact];
 const text=(s||'').trim().toLowerCase().replace(/\s+2027$/,'');
 const months=['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'];
 const month=months.indexOf(text);
 if(month>=0)return[new Date(2027,month,1),new Date(2027,month+1,0)];
 return null;
}
function inPeriod(e){
 if(period==='year')return true;
 const m=period==='current'?CM:+period,ms=new Date(2027,m,1),me=new Date(2027,m+1,0,23,59,59);
 const start=dateBounds(e.start),end=dateBounds(e.end),key=eventDate(e.sortDate);
 if(start&&end)return start[0]<=me&&end[1]>=ms;
 const known=start||end;
 if(known)return known[0]<=me&&known[1]>=ms;
 return key?key>=ms&&key<=me:false;
}
function filt(){let q=$('q').value.toLowerCase().trim(),sport=$('sport').value,type=$('type').value,country=$('country').value,status=$('status').value,cl=$('cls').value,hide=$('hide').checked;return data.filter(e=>{let blob=[e.sport,e.name,e.venue,e.country,e.city,e.manager,e.notes,e.types].join(' ').toLowerCase();return inPeriod(e)&&(!q||blob.includes(q))&&(!sport||e.sport===sport)&&(!type||(e.types||e.type).split('|').map(x=>x.trim()).includes(type))&&(!country||e.country===country)&&(!status||e.status===status)&&(!cl||e.classification===cl)&&(!hide||e.status!=='Скасовано')}).sort((a,b)=>date(a.sortDate)-date(b.sortDate)||a.sport.localeCompare(b.sport,'uk')||a.name.localeCompare(b.name,'uk'))}
function cls(s){return s==='Скасовано'?'cancel':s==='Підтверджено'?'confirmed':s==='Заплановано'?'planned':''}
function temporalBadge(e){
 if(e.status==='Скасовано'||e.datePrecision!=='Точні')return'';
 let s=eventDate(e.start), en=eventDate(e.end), today=new Date();
 today.setHours(0,0,0,0);
 if(s&&en&&s<=today&&en>=today)return'<span class="b live">Триває</span>';
 if(s&&s>today)return'<span class="b upcoming">Попереду</span>';
 if(en&&en<today)return'<span class="b done">Завершено</span>';
 return'';
}
function splitDate(s){let d=eventDate(s);return d?{d:String(d.getDate()).padStart(2,'0'),m:d.getMonth(),y:d.getFullYear()}:null}
function card(e){
 let sd=splitDate(e.start), ed=splitDate(e.end);
 let left=sd?`<div class="date-day">${sd.d}</div><div class="date-month">${mn[sd.m]}</div><div class="date-end">${ed?`до ${ed.d} ${mn[ed.m].toLowerCase()}`:'дата завершення уточнюється'}</div>`:`<div class="date-day">—</div><div class="date-month">дата</div><div class="date-end">уточнюється</div>`;
 return`<article class="card ${e.status==='Скасовано'?'cancel':''}" data-id="${esc(e.id)}" tabindex="0" role="button"><div class="card-inner"><div class="datebox">${left}</div><div class="card-body"><div class="title">${esc(e.name)}</div><div class="sport">${esc(e.sport)}</div><div class="badges"><span class="b">${esc(e.type)}</span>${e.status?`<span class="b ${cls(e.status)}">${esc(e.status)}</span>`:''}${e.classification==='Так'?'<span class="b cls">Класифікація</span>':''}${temporalBadge(e)}</div><div class="info"><div class="k">Період</div><div>${esc(e.start||'уточнюється')} — ${esc(e.end||'уточнюється')}</div><div class="k">Місце</div><div>${esc(e.venue||'уточнюється')}</div>${e.manager?`<div class="k">Відповідальний</div><div>${esc(e.manager)}</div>`:''}</div>${e.notes?`<div class="notes">${esc(e.notes)}</div>`:''}</div></div></article>`}
const mn=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
function cards(a){if(!a.length)return'<div class="empty">За вибраний період і фільтри заходів не знайдено</div>';return'<div class="cards">'+a.map(card).join('')+'</div>'}
function table(a){if(!a.length)return'<div class="empty">За вибраний період і фільтри заходів не знайдено</div>';return`<div class="table"><table><thead><tr><th>Дата</th><th>Вид спорту</th><th>Захід</th><th>Місце</th><th>Тип</th><th>Статус</th><th>Відповідальний</th></tr></thead><tbody>${a.map(e=>`<tr><td>${esc(e.start||'уточнюється')}</td><td>${esc(e.sport)}</td><td>${esc(e.name)}</td><td>${esc(e.venue||'уточнюється')}</td><td>${esc(e.types||e.type)}</td><td>${esc(e.status||'—')}</td><td>${esc(e.manager)}</td></tr>`).join('')}</tbody></table></div>`}
function periodName(){if(period==='year')return'Весь 2027 рік';return mn[+period]+' 2027'}
function drawPeriods(){let a=[...mn.map((x,i)=>[String(i),x]),['year','Весь 2027 рік']];$('periodbar').innerHTML=a.map(x=>`<button data-p="${x[0]}" class="${period===x[0]?'active':''}">${x[1]}</button>`).join('');$('periodbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{period=b.dataset.p;drawPeriods();render()})}

function openDetail(id){
 let e=data.find(x=>x.id===id);if(!e)return;
 $('modaltitle').textContent=e.name;
 let status=e.status||'—';
 $('modalbody').innerHTML=`<div class="badges"><span class="b">${esc(e.type)}</span>${e.status?`<span class="b ${cls(e.status)}">${esc(e.status)}</span>`:''}${e.classification==='Так'?'<span class="b cls">Класифікація</span>':''}${temporalBadge(e)}</div><div class="detail-grid"><div class="detail-k">Вид спорту</div><div>${esc(e.sport)}</div><div class="detail-k">Дата початку</div><div>${esc(e.start||'уточнюється')}</div><div class="detail-k">Дата завершення</div><div>${esc(e.end||'уточнюється')}</div><div class="detail-k">Місце проведення</div><div>${esc(e.venue||'уточнюється')}</div><div class="detail-k">Країна</div><div>${esc(e.country||'не визначена')}</div><div class="detail-k">Місто</div><div>${esc(e.city||'не визначено')}</div><div class="detail-k">Тип заходу</div><div>${esc(e.types||e.type)}</div><div class="detail-k">Статус</div><div>${esc(status)}</div><div class="detail-k">Відповідальний</div><div>${esc(e.manager||'—')}</div><div class="detail-k">Точність дат</div><div>${esc(e.datePrecision||'—')}</div></div>${e.notes?`<div class="modal-note"><strong>Примітка:</strong> ${esc(e.notes)}</div>`:''}`;
 $('modalback').classList.add('show');
}
function bindCards(){
 document.querySelectorAll('.card[data-id]').forEach(c=>{
   c.onclick=()=>openDetail(c.dataset.id);
   c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(c.dataset.id)}};
 });
}

function shiftMonth(delta){
 let p=period==='year'?(CY===2027?CM:0):+period;
 p=Math.max(0,Math.min(11,p+delta));
 period=String(p);drawPeriods();render();
}
function render(){let a=filt();$('content').innerHTML=view==='cards'?cards(a):table(a);$('meta').textContent=`Показано: ${a.length} із ${data.length}`;$('periodtitle').textContent=periodName()+(CY===2027&&period===String(CM)?' · поточний місяць':'');$('periodcount').textContent=`Заходів: ${a.length}`;let planned=a.filter(e=>e.status==='Заплановано').length,confirmed=a.filter(e=>e.status==='Підтверджено').length,cancelled=a.filter(e=>e.status==='Скасовано').length,missing=a.filter(e=>!e.status).length;$('eventstats').textContent=`Усього ${a.length} · заплановано ${planned} · підтверджено ${confirmed} · скасовано ${cancelled}${missing?' · статус не заповнено '+missing:''}`;$('cards').classList.toggle('active',view==='cards');$('table').classList.toggle('active',view==='table');if(view==='cards')bindCards()}
$('modalclose').onclick=()=>$('modalback').classList.remove('show');$('modalback').onclick=e=>{if(e.target===$('modalback'))$('modalback').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modalback').classList.remove('show')});
$('prevmonth').onclick=()=>shiftMonth(-1);$('nextmonth').onclick=()=>shiftMonth(1);$('printbtn').onclick=()=>window.print();
async function load(){ $('notice').style.display='none'; $('meta').textContent='Завантаження…'; try{let r=await fetch(CSV+'&cachebust='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!r.ok)throw 0;let rows=csv(await r.text()).filter(x=>x[0]);if(rows[0]?.[0]!=='Event ID')throw new Error('Invalid feed');data=rows.slice(1).map(obj).filter(e=>e.id&&e.sport&&e.name)}catch(e){data=[];$('notice').style.display='block';$('notice').textContent='Не вдалося завантажити календар. Перевірте з’єднання та натисніть «Оновити дані».'}setSel('sport','sport','Усі види спорту');setSel('type','type','Усі типи заходів');setSel('country','country','Усі країни');setSel('status','status','Усі статуси');drawPeriods();render()}
$('reload').onclick=load;
['q','sport','type','country','status','cls','hide'].forEach(x=>$(x).addEventListener('input',render));$('cards').onclick=()=>{view='cards';render()};$('table').onclick=()=>{view='table';render()};$('reset').onclick=()=>{['q','sport','type','country','status','cls'].forEach(x=>$(x).value='');$('hide').checked=false;render()};load();
</script></body></html>
